name: Docker Build Check

on:
  push:
    branches: [ main ] # mainブランチにpushされたら実行
  workflow_dispatch: # GitHub Actionsの画面から手動実行が可能

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    # ✅ v4 から v6 に更新 (Node.js 24 対応)
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # 💡 git diff を正確に取るため、すべての履歴を取得（浅いクローンを避ける）
        fetch-depth: 0
      env:
        # 「デフォルトブランチ名は main です」と、実行の瞬間に Git に直接叩き込む
        GIT_CONFIG_PARAMETERS: "'init.defaultBranch=main'"

    # 💡 Git のデフォルトブランチ警告を抑制
    - name: Configure Git
      run: git config --global init.defaultBranch main

    # ✅ v5 から v6 に更新 (Node.js 24 対応)
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true        # 依存関係のキャッシュを有効化して、さらに高速化

    # 🔥 コード生成前の「真っ新な状態」で開発者の更新漏れをチェック
    # =================================================================
    - name: Check go.mod tidy before code generation
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "🚨 Error: Please run 'go mod tidy' locally and commit the changes!" && exit 1)

    # 💡 CI環境へ protoc コマンドをインストールする
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # 💡 Go の gRPC 生成プラグインをインストールする
    - name: Install Protoc Plugins
      run: |
        # Go 用プラグインのインストール
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
        # インストールしたバイナリのある場所にパスを通す
        echo "$HOME/go/bin" >> $GITHUB_PATH

    # 💡 GitHub上の空フォルダ(pb)に、その場でgRPCコードを復元・自動生成する
    - name: Generate gRPC Codes
      run: make gen-proto

    # 💡 自動生成によって生じた go.mod の変化を、ステップを跨いで永続化させる
    - name: Tidy Dependencies after Generation
      run: go mod tidy

# --- ここから「Push時」にも必ず走る高品質化ステップ ---
    # ==========================================
    # Phase 1: Quality Gate (Push & Manual)
    # 常に実行され、コードの健全性を担保するセーフティ工程
    # ==========================================
    # ✅ ステップ1: Go 基本品質チェック（静的解析・コンパイル）
    # 依存関係、コードの整合性、潜在的なバグをまとめて検証します。
    # go.mod / go.sum の更新漏れを検知し、ビルドの再現性を守ります。
    - name: Basic Quality Check
      run: |
        # 💡 自動生成コードが加わった最新の状態にモジュールを完全同期
        go mod tidy
        # コンパイルは通るが潜在的なバグの原因になりそうなコードを検知します。
        go vet ./...
        # 全パッケージが正しくビルド可能か、Dockerビルド前に検証します
        go build -v ./...
    
    # 🔐 1. セキュリティ：ソースコードにパスワードなどの流出がないか
    - name: Check for Git Secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 🐹 ステップ2: Go 静的解析 (Linter)
    # go vet よりも遥かに厳しいチェック（未使用変数、複雑度、スペルミス等）を行い、
    # チーム開発における「読みやすさ」を機械的に担保します。
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
    
    # 🐍📐 3. 自作コンテナ：Python(Ruff/Mypy) と Go-Arch-Lint を一括処理
    # ※ docker-compose.yml 側の command を「go-arch-lint check && ruff ... && mypy ...」に調整しておきます
    - name: Run Custom Linters (go-arch-lint & Python Quality Check)
      run: |
        docker compose --profile tools build static-analysis
        docker compose --profile tools run --rm static-analysis

    # 🧪 4. テスト＆品質可視化
    # これが失敗すると、下のビルドやデプロイは実行されません（安全！）
    # env を追加し、テストが「モックモード」で動くことを明示します。
    - name: Run Tests
      env:
        # コード側で os.Getenv("STORAGE_TYPE") を見ている場合、
        # ここで mock や local を渡すことで、CI上での不要なエラーを防ぎます。
        STORAGE_TYPE: mock
        DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy
      run: go test -v ./...

    # --- ここから「手動実行（workflow_dispatch）」時のみ走るステップ ---

    # ==========================================
    # Phase 2: Docker Build & Security Scan (デプロイ時のみ実行)
    # workflow_dispatch 時のみ実行される
    # ==========================================
    # ✅ ステップ5: Google Cloud 認証
    - name: Google Auth
      if: github.event_name == 'workflow_dispatch'
      uses: 'google-github-actions/auth@v2'
      with:
        # JSONキーを使わず、IDプールを指定する「Keyless」な記述
        # Terraformで作成したProviderのフルパスを指定
        # projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
        workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
        service_account: 'file-transfer-app-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

    # ✅ ステップ6: クラウド環境・Docker 認証
    - name: Set up Cloud SDK
      if: github.event_name == 'workflow_dispatch'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Docker Auth
      if: github.event_name == 'workflow_dispatch'
      run: |-
        gcloud auth configure-docker us-west1-docker.pkg.dev

    # ✅ ステップ7: Go アプリの Dockerビルド & プッシュ
    # Secretを参照するため手動実行に限定。SHAタグでトレーサビリティを確保します。
    - name: Build Docker image
      if: github.event_name == 'workflow_dispatch'
      run: |
        docker build -t file-transfer-api:${{ github.sha }} .
        docker build -t python-rag-worker:${{ github.sha }} ./python_rag_worker
    
    # コンテナセキュリティスキャン (Trivy)
    # 本番環境へデプロイされる直前の成果物に、深刻な脆弱性(CRITICAL)が混入していないかダブルチェック
    - name: Run Trivy Vulnerability Scanner (Go API)
      if: github.event_name == 'workflow_dispatch'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'file-transfer-api:${{ github.sha }}'
        format: 'table'
        exit-code: '1' # 💡 深刻な脆弱性検出時、パイプラインをここで即座に遮断する
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy Vulnerability Scanner (Python Worker)
      if: github.event_name == 'workflow_dispatch'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'python-rag-worker:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
    
    # ✅ ステップ7.5 :Docker プッシュ
    - name: Push Docker image
      if: github.event_name == 'workflow_dispatch'
      run: |
        docker tag file-transfer-api:${{ github.sha }} us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/file-transfer-api:${{ github.sha }}
        docker tag python-rag-worker:${{ github.sha }} us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/python-rag-worker:${{ github.sha }}
        
        docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/file-transfer-api:${{ github.sha }}
        # Python側のディレクトリを指定してビルド。Dockerfileはマルチステージ等で構成されている前提
        docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/python-rag-worker:${{ github.sha }}

    # ==========================================
    # Phase 3: Cloud Deployment (Manual Only)
    # ==========================================
    # ✅ ステップ8: Go アプリの Cloud Run へのデプロイ
    # 適切な環境変数とDB接続を構成し、最終的なリリースを実行します。
    - name: Deploy to Cloud Run
      if: github.event_name == 'workflow_dispatch'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: 'file-transfer-api'
        image: 'us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/file-transfer-api:${{ github.sha }}'
        region: 'us-west1'
        # 初回デプロイ時は、認証なしアクセスを許可（APIとして公開する場合）
        flags: |
          --allow-unauthenticated
          --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:us-west1:file-transfer-db
        env_vars: |
          STORAGE_TYPE=gcs
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          BUCKET_NAME=file-transfer-bucket-syou-20240121
          DATABASE_URL=postgres://app_user:${{ secrets.DB_PASSWORD }}@/transfer_metadata?host=%2Fcloudsql%2F${{ secrets.GCP_PROJECT_ID }}:us-west1:file-transfer-db
    
    # ✅ ステップ8.5: Python RAG Worker (Pub/Sub) を Cloud Run (サイドカー/常時稼働) にデプロイ
    # 💡 ポイント：イベント駆動ワーカーのため ingress=none (外部アクセス遮断) にし、
    # 　　CPUを常に割り当てることで、Pub/Subのイベントを即座に拾えるようにします。
    - name: Deploy Python Worker to Cloud Run
      if: github.event_name == 'workflow_dispatch'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: 'python-rag-worker'
        image: 'us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/python-rag-worker:${{ github.sha }}'
        region: 'us-west1'
        flags: |
          --no-allow-unauthenticated
          --ingress=none
          --no-cpu-throttling
          --min-instances=1
        # インフラから参照する環境変数をここで綺麗に注入
        env_vars: |
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          PUBSUB_SUBSCRIPTION_ID=file-ingest-sub
          STORAGE_ROOT=/storage
